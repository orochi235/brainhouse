<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Window frame with a title-bar divider; prompt chevron + cursor
       underscore make it read as a terminal. Proportions and the 1.25
       stroke are tuned for the ~14px reveal buttons: a taller title band
       and lighter line keep the bar from fusing into the frame. -->
  <rect x="1.5" y="2" width="13" height="12" rx="2" />
  <path d="M1.5 5.75 H14.5" />
  <polyline points="4.25 8.25 6.6 10 4.25 11.75" />
  <path d="M8.9 11.9 H12" />
</svg>
